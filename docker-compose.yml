services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/html
    environment:
      DATABASE_URL: "mysql://siroko:siroko@mysql:3306/siroko?serverVersion=8.0&charset=utf8mb4"
      APP_ENV: dev
      APP_SECRET: change_me_in_production
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: siroko
      MYSQL_USER: siroko
      MYSQL_PASSWORD: siroko
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-usiroko", "-psiroko"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql_test:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: siroko_test
      MYSQL_USER: siroko
      MYSQL_PASSWORD: siroko
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-usiroko", "-psiroko"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
